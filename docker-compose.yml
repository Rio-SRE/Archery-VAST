version: '3'
services:
  mysql:
    image: mysql:5.7
    container_name: archery-mysql
    restart: always
    ports:
      - '3307:3306'
    environment:
      MYSQL_ROOT_PASSWORD: Archery@2026!
      MYSQL_DATABASE: archery
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_general_ci
    volumes:
      - ./mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci

  redis:
    image: redis:7-alpine
    container_name: archery-redis
    restart: always

  goinception:
    image: hanchuanchuan/goinception:latest
    container_name: archery-goinception
    restart: always
    ports:
      - '4000:4000'

  archery:
    image: hhyo/archery:v1.10.0
    container_name: archery
    restart: always
    ports:
      - '9123:9123'
    environment:
      NGINX_PORT: '9123'
      DATABASE_URL: mysql://root:Archery@2026!@mysql:3306/archery
      CACHE_URL: redis://redis:6379/0
      SECRET_KEY: archery-cloudops-secret-key-2026
      DINGDING_ENABLED: 'false'
    depends_on:
      - mysql
      - redis
    volumes:
      - ./archery_downloads:/opt/archery/downloads
      - ./archery_logs:/opt/archery/logs
