{% extends "base.html" %}

{% block content %}
    <!-- 自定义操作按钮-->
    <div id="toolbar" class="form-inline pull-left">
        <div class="form-group">
            <select id="type" class="form-control selectpicker">
                <option value="" selected="selected">实例类型</option>
                <option value="master">MASTER</option>
                <option value="slave">SLAVE</option>
            </select>
        </div>
        <div class="form-group">
            <select id="db_type" class="form-control selectpicker">
                <option value="" selected="selected">数据库类型</option>
                {% for name, engine in engines.items %}
                    <option value="{{ name }}">{{ engine.name }}</option>
                {%  endfor %}
            </select>
        </div>
        <div class="form-group">
            <select id="tags" class="form-control selectpicker" data-live-search="true"
                    multiple data-selected-text-format="count > 2" data-none-selected-text="标签筛选">
                {% for tag in tags %}
                    <option value="{{ tag.id }}">{{ tag.tag_name }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group ">
            <button id="btn_add_master" type="button" class="btn btn-default"
                    onclick="window.open('/admin/sql/instance/add/')">
                <span class="glyphicon glyphicon-plus" aria-hidden="true"></span>
                添加实例
            </button>
        </div>
    </div>
    <!-- 表格-->
    <div class="table-responsive">
        <table id="instance-list" data-toggle="table" class="table table-striped table-hover"
               style="table-layout:inherit;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">
        </table>
    </div>
    <!-- 删除Binlog日志的模态框-->
    <div class="modal fade" id="deleteBinlog" tabindex="-1" role="dialog" aria-labelledby="myModalLabel">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close"><span
                            aria-hidden="true">&times;</span></button>
                    <h4 class="modal-title" id="myModalLabel">清理Binlog日志</h4>
                </div>
                <div class="modal-body">
                    <div class="form-group">
                        <input type="text" class="form-control" id="delete_instance_name" name="instance_name" readonly>
                    </div>
                    <div class="form-group">
                        <select id="binlog" name="binlog" data-live-search="true"
                                class="form-control selectpicker show-tick bs-select-hidden ">
                        </select>
                    </div>
                    <p class="text-danger">提示：该binlog前的所有binlog都会被删除！</p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-default" data-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-danger" id="cleanLogBtn">清理</button>
                </div>
            </div>
        </div>
    </div>
{% endblock content %}
{% block js %}
    {% load static %}
    <script src="{% static 'bootstrap-table/js/bootstrap-table-export.min.js' %}"></script>
    <script src="{% static 'bootstrap-table/js/tableExport.min.js' %}"></script>
    <script>
        //获取列表
        function instancelist() {
            //采取异步请求
            //初始化table
            $('#instance-list').bootstrapTable('destroy').bootstrapTable({
                escape: false,
                method: 'post',
                contentType: "application/x-www-form-urlencoded",
                url: "/instance/list/",
                striped: true,                      //是否显示行间隔色
                cache: false,                       //是否使用缓存，默认为true，所以一般情况下需要设置一下这个属性（*）
                pagination: true,                   //是否显示分页（*）
                sortable: true,                     //是否启用排序
                sortOrder: "asc",                   //排序方式
                sortName: 'id',                   //排序字段
                sidePagination: "server",           //分页方式：client客户端分页，server服务端分页（*）
                pageNumber: 1,                      //初始化加载第一页，默认第一页,并记录
                pageSize: 20,
                pageList: [20, 30, 50, 100],
                showExport: true,                   //是否显示导出按钮
                exportOptions: {
                    fileName: 'instance'  //文件名称设置
                },
                search: true,                      //是否显示表格搜索
                strictSearch: false,                //是否全匹配搜索
                showColumns: true,                  //是否显示所有的列（选择显示的列）
                showRefresh: true,                  //是否显示刷新按钮
                minimumCountColumns: 2,             //最少允许的列数
                clickToSelect: true,                //是否启用点击选中行
                uniqueId: "id",                     //每一行的唯一标识，一般为主键列
                showToggle: true,                   //是否显示详细视图和列表视图的切换按钮
                cardView: false,                    //是否显示详细视图
                detailView: false,                  //是否显示父子表
                locale: 'zh-CN',                    //本地化
                toolbar: "#toolbar",               //指明自定义的toolbar
                queryParamsType: 'limit',
                onClickSort: function() {},
                instanceScope: {% if monitor %} 'all' {% else %} 'manual' {% endif %},
                //请求服务数据时所传参数
                queryParams:
                    function (params) {
                        return {
                            limit: params.limit,
                            offset: params.offset,
                            search: params.search,
                            type: $("#type").val(),
                            db_type: $("#db_type").val(),
                            tags: $("#tags").val(),
                            sortName: params.sort,
                            sortOrder: params.order,
                            scope: {% if monitor %} 'all' {% else %} 'manual' {% endif %}
                        }
                    },
                columns: [
                    {
                        title: 'ID',
                        field: 'id',
                        sortable: true
                    }, {
                        title: '实例名称',
                        field: 'instance_name',
                        sortable: true,
                        formatter: function (value, row, index) {
                            return "<a target=\"_blank\" href=\"/admin/sql/instance/" + row.id + "/change/\">" + value + "</a>"
                        }
                    }, {
                        title: '实例类型',
                        field: 'type'
                    }, {
                        title: '数据库类型',
                        field: 'db_type',
                        sortable: true
                    }, {
                        title: '云厂商',
                        field: 'cloud',
                        formatter: function (value, row, index) {
                            if (value === 'aws') {
                                return '<span class="label label-warning">AWS</span>';
                            }
                            if (value === 'aliyun') {
                                return '<span class="label label-info">阿里云</span>';
                            }
                            return value || '-';
                        }
                    }, {
                        title: '健康巡检',
                        field: 'health',
                        formatter: function (value, row, index) {
                            return '<span id="health-' + row.id + '" class="label label-default">巡检中</span>';
                        }
                    }, {
                        title: '连接水位',
                        field: 'conn_pct',
                        sortable: false,
                        formatter: function (value, row, index) {
                            var v = (value === undefined || value === null || value === '') ? '-' : value;
                            return '<span class="wm-conn" data-id="' + row.id + '">' + v + '</span>';
                        }
                    }, {
                        title: 'QPS水位',
                        field: 'qps_pct',
                        sortable: false,
                        formatter: function (value, row, index) {
                            var v = (value === undefined || value === null || value === '') ? '-' : value;
                            return '<span class="wm-qps" data-id="' + row.id + '">' + v + '</span>';
                        }
                    }, {
                        title: '存储水位',
                        field: 'disk_pct',
                        sortable: false,
                        formatter: function (value, row, index) {
                            return '<span class="wm-disk" data-id="' + row.id + '">-</span>';
                        }
                    }, {
                        title: 'CPU / 内存',
                        field: 'spec',
                        sortable: false,
                        formatter: function (value, row, index) {
                            return '<span class="wm-spec" data-id="' + row.id + '">-</span>';
                        }
                    }, {
                        title: 'HOST',
                        field: 'host',
                        sortable: false
                    }
                    {% if not monitor %}
                    , {
                        title: 'PORT',
                        field: 'port'
                    }, {
                        title: 'USER',
                        field: 'user'
                    }, {
                        title: '操作',
                        field: '',
                        formatter: function (value, row, index) {
                            var btn_del_binLog = '';
                            var btn_user_manger = '';
                            if (row.db_type === 'mysql') {
                                btn_del_binLog = "<button class=\"btn btn-danger btn-xs\" instance_id=\"" + row.id + "\" + instance_name=\"" + row.instance_name + "\"+ onclick=\"del_binLog(this)" + "\">Binlog清理</button>\n"
                            }
                            var btn_test = "<button class=\"btn btn-warning btn-xs\" instance_id=\"" + row.id + "\" onclick=\"check_instance(this)" + "\">测试</button>\n";
                            return btn_user_manger + btn_del_binLog + btn_test
                        }
                    }
                    {% endif %}
                    ],
                onLoadSuccess: function (res) {
                    var rows = (res && res.rows) ? res.rows : [];
                    window._instanceHealthRows = rows;
                    function applyHealth(d) {
                        if (!d) return;
                        var ok = d.health === 'up';
                        var cls = ok ? 'label-success' : 'label-danger';
                        var text = ok ? ('正常 ' + (d.latency_ms || 0) + 'ms') : '异常';
                        $('#health-' + d.id).attr('class', 'label ' + cls).attr('title', d.msg || '').text(text);
                        function level(v, maxv, pct) {
                            if (v == null || maxv == null) return '-';
                            var color = '#5cb85c';
                            if (pct >= 80) color = '#d9534f';
                            else if (pct >= 60) color = '#f0ad4e';
                            return '<span style="color:' + color + ';font-weight:bold">' + v + ' / ' + maxv + ' (' + pct + '%)</span>';
                        }
                        $('.wm-conn[data-id="' + d.id + '"]').html(ok ? level(d.conn, d.conn_max, d.conn_pct) : '-');
                        $('.wm-qps[data-id="' + d.id + '"]').html(ok ? level(d.qps, d.qps_max, d.qps_pct) : '-');
                        /* CPU / 内存 */
                        if (d.cpu != null && d.mem != null) {
                            var memGb = (d.mem / 1024).toFixed(0);
                            $('.wm-spec[data-id="' + d.id + '"]').html(d.cpu + ' 核 / ' + memGb + ' GB');
                        }
                        var tblData = $('#instance-list').bootstrapTable('getData');
                        if (tblData) {
                            tblData.forEach(function (item) {
                                if (item.id === d.id) {
                                    item.conn_pct = ok ? (parseFloat(d.conn_pct) || 0) : -1;
                                    item.qps_pct = ok ? (parseFloat(d.qps_pct) || 0) : -1;
                                }
                            });
                        }
                    }
                    function probeBatch(refresh) {
                        var ids = (window._instanceHealthRows || []).map(function (r) { return r.id; }).join(',');
                        if (!ids) return;
                        $.ajax({
                            type: 'get',
                            url: '/instance/health_batch/',
                            dataType: 'json',
                            data: {ids: ids, refresh: refresh ? 1 : 0},
                            success: function (data) {
                                (data.rows || []).forEach(applyHealth);
                            },
                            error: function () {
                                (window._instanceHealthRows || []).forEach(function (row) {
                                    $('[id="health-' + row.id + '"]').attr('class', 'label label-danger').text('异常');
                                });
                            }
                        });
                    }
                    probeBatch(false);
                    /* 存储指标 */
                    function diskLevel(used, total, pct) {
                        if (used == null || total == null) return '-';
                        var color = '#5cb85c';
                        if (pct >= 80) color = '#d9534f';
                        else if (pct >= 60) color = '#f0ad4e';
                        return '<span style="color:' + color + ';font-weight:bold">' + used + ' / ' + total + ' GB (' + pct + '%)</span>';
                    }
                    function applyStorage(data) {
                        if (!data) return;
                        for (var idStr in data) {
                            var d = data[idStr];
                            if (d.disk_used_gb != null && d.disk_total_gb != null) {
                                $('.wm-disk[data-id="' + idStr + '"]').html(diskLevel(d.disk_used_gb, d.disk_total_gb, d.disk_pct));
                            } else if (d.disk_total_gb != null) {
                                $('.wm-disk[data-id="' + idStr + '"]').html(d.disk_total_gb + ' GB');
                            }
                            if (d.spec) {
                                $('.wm-spec[data-id="' + idStr + '"]').attr('title', d.spec + (d.engine ? ' · ' + d.engine : ''));
                            }
                        }
                        var tblData = $('#instance-list').bootstrapTable('getData');
                        if (tblData) {
                            tblData.forEach(function (item) {
                                var sd = data[item.id];
                                if (sd) item.disk_pct = sd.disk_pct != null ? parseFloat(sd.disk_pct) : -1;
                            });
                        }
                    }
                    function fetchStorage() {
                        $.ajax({
                            type: 'get', url: 'http://39.96.66.171:8080/api/storage',
                            dataType: 'json', timeout: 30000,
                            success: function (resp) { if (resp.status === 0 && resp.data) applyStorage(resp.data); }
                        });
                    }
                    fetchStorage();
                    if (window._storageTimer) clearInterval(window._storageTimer);
                    window._storageTimer = setInterval(fetchStorage, 300000);
                    if (window._instanceHealthTimer) {
                        clearInterval(window._instanceHealthTimer);
                    }
                    window._instanceHealthTimer = setInterval(function () {
                        probeBatch(true);
                    }, 60000);
                },

                onLoadError: onLoadErrorCallback,
                onSearch: function (e) {
                    //传搜索参数给服务器
                    queryParams(e)
                }
            });

        }

        
        // 表格加载后注入排序按钮到表头
        $(document).on('post-body.bs.table', '#instance-list', function () {
            var $hdr = $('#instance-list thead tr:first');
            $hdr.find('th').each(function () {
                var $th = $(this);
                var field = $th.attr('data-field');
                if (field === 'conn_pct' || field === 'qps_pct' || field === 'disk_pct') {
                    if (!$th.find('.wm-sort-btn').length) {
                        $th.css({'white-space': 'nowrap'});
                        $th.find('.th-inner').css({'display': 'inline-flex', 'align-items': 'center', 'gap': '6px'});
                        $th.find('.th-inner').append('<span class="wm-sort-btn order" data-wm="' + field + '" style="cursor:pointer;margin-left:2px" title="点击排序"><span class="caret" style="margin:0;display:block;margin-bottom:2px;border-bottom-color:#999;border-top:0;border-bottom:4px dashed"></span><span class="caret" style="margin:0;display:block;border-top-color:#999"></span></span>');
                    }
                }
            });
        });

        $(document).on('click', '.wm-sort-btn', function (e) {
            e.preventDefault();
            e.stopPropagation();
            var field = $(this).data('wm');
            var $tbody = $('#instance-list').find('tbody');
            var data = $('#instance-list').bootstrapTable('getData') || [];
            window._wmDir = window._wmDir || {};
            window._wmDir[field] = window._wmDir[field] === 'asc' ? 'desc' : 'asc';
            var dir = window._wmDir[field];
            $('.wm-sort-btn').each(function () {
                if ($(this).data('wm') === field) {
                    if (dir === 'desc') {
                        $(this).html('<span class="caret" style="margin:0;border-top-color:#000"></span>');
                    } else {
                        $(this).html('<span class="caret" style="margin:0;border-bottom-color:#000;border-top:0;border-bottom:4px dashed"></span>');
                    }
                } else {
                    $(this).html('<span class="caret" style="margin:0;display:block;margin-bottom:2px;border-bottom-color:#999;border-top:0;border-bottom:4px dashed"></span><span class="caret" style="margin:0;display:block;border-top-color:#999"></span>');
                }
            });
            var idToVal = {};
            data.forEach(function (item) {
                idToVal[item.id] = parseFloat(item[field]);
                if (isNaN(idToVal[item.id])) idToVal[item.id] = -1;
            });
            var rows = $tbody.children('tr').get();
            rows.sort(function (a, b) {
                var idA = parseInt($(a).attr('data-uniqueid') || $(a).find('td:first').text(), 10);
                var idB = parseInt($(b).attr('data-uniqueid') || $(b).find('td:first').text(), 10);
                var vA = idToVal[idA] !== undefined ? idToVal[idA] : -1;
                var vB = idToVal[idB] !== undefined ? idToVal[idB] : -1;
                return dir === 'asc' ? vA - vB : vB - vA;
            });
            $.each(rows, function (i, row) { $tbody.append(row); });
            return false;
        });

        // 检测邮件
        function check_instance(obj) {
            $.ajax({
                type: "post",
                url: "/check/instance/",
                dataType: "json",
                data: {
                    'instance_id': $(obj).attr("instance_id")
                },
                complete: function () {
                },
                success: function (data) {
                    if (data.status === 0) {
                        alert('连接成功')
                    } else {
                        alert(data.msg);
                    }
                },
                error: function (XMLHttpRequest, textStatus, errorThrown) {
                    alert(errorThrown);
                }
            });
        }

        //删除binlog
        function del_binLog(obj) {
            $("#delete_instance_name").val($(obj).attr("instance_name"));
            $("#binlog option").remove();
            $.ajax({
                type: "post",
                url: "/binlog/list/",
                dataType: "json",
                data: {
                    'instance_name': $(obj).attr("instance_name")
                },
                complete: function () {
                },
                success: function (data) {
                    if (data.status === 0) {
                        var result = data.data;
                        for (var i = 0; i < result.length; i++) {
                            var _html = "<option value='" + result[i]['Log_name'] + "'>" + result[i]['Log_name'] + " Size:" + result[i]['File_size'] + "</option>";
                            $("#binlog").append(_html);
                        }
                        $("#binlog").prepend('<option value="is-empty" disabled="" selected="selected">请选择Binlog:</option>');
                        $('#binlog').selectpicker('render');
                        $('#binlog').selectpicker('refresh');
                    } else {
                        alert(data.msg);
                    }
                }
            });
            $("#deleteBinlog").modal('show');
            $("#cleanLogBtn").unbind("click").click(function () {
                $.ajax({
                    type: "post",
                    url: "/binlog/del_log/",
                    dataType: "json",
                    data: {
                        instance_id: $(obj).attr("instance_id"),
                        binlog: $("#binlog").val()
                    },
                    complete: function () {
                    },
                    success: function (data) {
                        alert(data.msg);
                        window.location.reload(true);

                    },
                    error: function (XMLHttpRequest, textStatus, errorThrown) {
                        alert(errorThrown);
                    }
                })
            });
        }

        //筛选变动自动刷新
        $("#type").change(function () {
            instancelist();
        });

        $("#db_type").change(function () {
            instancelist();
        });

        $("#tags").change(function () {
            instancelist();
        });

        //初始化数据
        $(document).ready(function () {
            instancelist()
        });
    </script>
{% endblock %}
